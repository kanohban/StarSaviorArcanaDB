  <script>
    (function () {
      // 1. Initialize State from LocalStorage
      const html = document.documentElement;
      const body = document.body;

      const savedTheme = localStorage.getItem('theme') || 'dark';
      html.setAttribute('data-theme', savedTheme);

      const savedView = localStorage.getItem('viewMode') || 'pc';
      if (savedView === 'mobile') {
        body.classList.add('mobile-mode');
      }

      // 2. DOM Manipulation Observer
      const observer = new MutationObserver((mutations, obs) => {
        const headerTop = document.querySelector('.header-top');
        // Check for wrapper to prevent infinite loop
        if (headerTop && !document.querySelector('.custom-header-wrapper')) {
          initCustomHeader(headerTop);
          modifyFilters();
        }

        // Initialize Custom Search if search input exists and hasn't been handled
        const searchInput = document.querySelector('.search-input');
        if (searchInput && !searchInput.classList.contains('handled-custom-search')) {
          initCustomSearch(searchInput);
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });

      // Custom Search Logic
      async function loadSearchData() {
        try {
          const [cardsRes, potentialsRes] = await Promise.all([
            fetch('./data/cards.json'),
            fetch('./data/potentials.json')
          ]);
          const cards = await cardsRes.json();
          const potentials = await potentialsRes.json();

          // Initialize SearchService
          if (window.SearchService) {
            window.SearchService.buildIndex(cards, null, potentials);
            console.log('Search Index Loaded via Service');
          }

          // Re-run filter if input has value
          const customInput = document.getElementById('custom-search-input');
          if (customInput && customInput.value) {
            filterCards(customInput.value);
          }

        } catch (e) {
          console.error('Failed to load search data', e);
        }
      }

      loadSearchData();

      function initCustomSearch(originalInput) {
        if (originalInput.id === 'custom-search-input') return; // Avoid self-reference

        // Mark as handled
        originalInput.classList.add('handled-custom-search');

        // Create Custom Input
        const customInput = originalInput.cloneNode(true);
        customInput.id = 'custom-search-input';
        customInput.classList.remove('handled-custom-search');
        customInput.value = '';
        customInput.placeholder = '카드 이름, 속성, 효과 검색...';

        // Hide Original (Keep it in DOM for React)
        originalInput.style.display = 'none';

        // Insert Custom Input
        originalInput.parentNode.insertBefore(customInput, originalInput);

        // Event Listener with Debounce
        const debouncedFilter = window.SearchService ? window.SearchService.debounce((query) => {
          filterCards(query);
        }, 300) : (query) => filterCards(query);

        customInput.addEventListener('input', (e) => {
          debouncedFilter(e.target.value.trim());
        });

        // Sync initial state if needed
        filterCards('');
      }

      function filterCards(query) {
        const cards = document.querySelectorAll('.card-item');
        const q = query.toLowerCase();

        // If empty query, show all (except if filtered by other means, but here we just remove search-hidden)
        if (!q) {
          cards.forEach(card => card.classList.remove('search-hidden'));
          return;
        }

        // Use SearchService to find matching titles
        let matchingTitles = new Set();
        if (window.SearchService) {
          const results = window.SearchService.search(q, { showCards: true, showJourneys: false });
          results.forEach(r => matchingTitles.add(r.title));
        }

        cards.forEach(card => {
          const titleEl = card.querySelector('h3');
          const title = titleEl ? titleEl.textContent.trim() : '';

          if (matchingTitles.has(title)) {
            card.classList.remove('search-hidden');
          } else {
            card.classList.add('search-hidden');
          }
        });
      }

      async function initCustomHeader(originalHeaderTop) {
        // Hide original content
        originalHeaderTop.style.display = 'none';

        const appHeader = document.querySelector('.app-header');

        // Create a wrapper for our custom header
        const wrapper = document.createElement('div');
        wrapper.className = 'custom-header-wrapper'; // Add class immediately
        // Insert it first
        appHeader.insertBefore(wrapper, appHeader.firstChild);

        // Initialize HeaderManager
        if (window.HeaderManager) {
          await window.HeaderManager.init(wrapper, 'index');
        } else {
          console.error('HeaderManager not loaded');
        }
      }

      function modifyFilters() {
        const options = document.querySelectorAll('option');
        options.forEach(opt => {
          if (opt.textContent === '모든 등급') opt.textContent = '등급';
          if (opt.textContent === '모든 타입') opt.textContent = '타입';
        });

        // Inject Star Filter Button if not exists
        const headerBottom = document.querySelector('.header-bottom');
        if (headerBottom && !document.querySelector('#fav-filter-btn')) {
          const starBtn = document.createElement('button');
          starBtn.id = 'fav-filter-btn';
          // Use header-btn class for consistent design
          starBtn.className = 'header-btn fav-filter-btn';
          starBtn.title = '즐겨찾기 모아보기';
          starBtn.innerHTML = '★'; // Star Icon

          // Load saved filter state
          const isFilterActive = localStorage.getItem('fav_filter_active') === 'true';
          if (isFilterActive) {
            starBtn.classList.add('active');
            document.body.classList.add('show-favorites-only');
          }

          starBtn.addEventListener('click', () => {
            starBtn.classList.toggle('active');
            const isActive = starBtn.classList.contains('active');
            document.body.classList.toggle('show-favorites-only', isActive);
            localStorage.setItem('fav_filter_active', isActive);

            // Force trigger a scan to update visibility immediately
            triggerScan();
          });

          headerBottom.appendChild(starBtn);
        }
      }

      // Helper to trigger the logic manually
      function triggerScan() {
        const root = document.getElementById('root');
        if (root) {
          scanAndApplyFavorites();
        }
      }

      function scanAndApplyFavorites() {
        let favorites = JSON.parse(localStorage.getItem('arcana_favorites')) || [];
        const cards = document.querySelectorAll('.card-item');
        const isFilterActive = document.body.classList.contains('show-favorites-only');

        cards.forEach(card => {
          // 1. Ensure Favorite Button Exists
          let btn = card.querySelector('.favorite-btn');
          if (!btn) {
            btn = createFavoriteButton();
            card.appendChild(btn);
            card.classList.add('has-fav-btn');
          }

          // 2. Update State based on CURRENT content (Handle Element Recycling)
          const titleEl = card.querySelector('h3');
          if (titleEl) {
            const currentCardId = titleEl.textContent.trim();
            const isFav = favorites.includes(currentCardId);

            if (isFav) {
              card.classList.add('is-favorite');
              btn.classList.add('active');
            } else {
              card.classList.remove('is-favorite');
              btn.classList.remove('active');
            }
          }

          // 3. Enforce Filter Visibility using CSS Class
          if (isFilterActive) {
            if (!card.classList.contains('is-favorite')) {
              card.classList.add('force-hidden');
            } else {
              card.classList.remove('force-hidden');
            }
          } else {
            // Filter is OFF: Always remove the forced hiding
            card.classList.remove('force-hidden');
          }
        });
      }

      function createFavoriteButton() {
        const btn = document.createElement('button');
        btn.className = 'favorite-btn';
        btn.title = '즐겨찾기';
        btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';

        // Dynamic Click Handler
        btn.addEventListener('click', (e) => {
          e.stopPropagation();

          // Read CURRENT ID at click time
          const card = btn.closest('.card-item');
          const titleEl = card.querySelector('h3');
          if (!titleEl) return;

          const cardId = titleEl.textContent.trim();
          let favorites = JSON.parse(localStorage.getItem('arcana_favorites')) || [];

          btn.classList.toggle('active');

          if (btn.classList.contains('active')) {
            card.classList.add('is-favorite');
            if (!favorites.includes(cardId)) {
              favorites.push(cardId);
            }
            // If filter is active, we just made it a favorite, so ensure it's shown
            if (document.body.classList.contains('show-favorites-only')) {
              card.classList.remove('force-hidden');
            }
          } else {
            card.classList.remove('is-favorite');
            favorites = favorites.filter(id => id !== cardId);

            // Hide immediately if filter is active
            if (document.body.classList.contains('show-favorites-only')) {
              card.classList.add('force-hidden');
            }
          }
          localStorage.setItem('arcana_favorites', JSON.stringify(favorites));
        });

        return btn;
      }

      // Observer Setup
      // Added characterData to catch text changes directly
      const observerConfig = { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'], characterData: true };
      const contentObserver = new MutationObserver((mutations) => {
        let shouldScan = false;
        mutations.forEach((mutation) => {
          if (mutation.addedNodes.length > 0) shouldScan = true;
          if (mutation.type === 'attributes' && mutation.target.classList.contains('card-item')) shouldScan = true;
          // If text changes inside a card (e.g. h3 text update)
          if (mutation.type === 'characterData') shouldScan = true;
          // Also check if childList changed on a descendant (e.g. h3 content replaced)
          if (mutation.type === 'childList' && mutation.target.closest && mutation.target.closest('.card-item')) shouldScan = true;
        });

        if (shouldScan) {
          contentObserver.disconnect();
          try {
            scanAndApplyFavorites();
            updateStatTags(); // NEW: Replace tags with images
            updateCardLayout(); // NEW: Restructure layout
          } finally {
            const root = document.getElementById('root');
            if (root) contentObserver.observe(root, observerConfig);
          }
        }
      });

      const root = document.getElementById('root');
      if (root) {
        contentObserver.observe(root, observerConfig);
      }

      // NEW: Function to restructure dom for overlay
      function updateCardLayout() {
        const cards = document.querySelectorAll('.card-item');
        cards.forEach(card => {
          const content = card.querySelector('.card-content');
          if (content) {
            const header = content.querySelector('.card-header');
            // Only move if it is still inside content
            if (header && header.parentElement === content) {
              card.appendChild(header);
            }
          }
          // Move stat-tag if it exists anywhere inside card but not as direct child
          const statTag = card.querySelector('.stat-tag');
          if (statTag && statTag.parentElement !== card) {
            card.appendChild(statTag);
          }
        });
      }

      // NEW: Function to replace text tags with images
      function updateStatTags() {
        const tags = document.querySelectorAll('.stat-tag');
        const iconMap = {
          '힘': '힘.png',
          '체력': '체력.png',
          '인내': '인내.png',
          '집중': '집중.png',
          '보호': '보호.png',
        };

        tags.forEach(tag => {
          const text = tag.textContent.trim();
          if (iconMap[text]) {
            // Check if already replaced to avoid duplicate imgs (though innerHTML set handles it)
            if (!tag.querySelector('img')) {
              tag.innerHTML = `<img src="./images/etc_icon/${iconMap[text]}" alt="${text}" class="stat-icon-img">`;
              tag.classList.add('has-icon');
            }
          }
        });
      }

      // Initialize Footer
      if (window.FooterManager) {
        window.FooterManager.init(document.getElementById('footer-container'));
      }
    })();
  </script>
