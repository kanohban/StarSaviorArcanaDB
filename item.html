<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스타 세이비어 DB - 아이템 Beta</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QGG707QJHS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-QGG707QJHS');
    </script>
    <link rel="icon" type="image/png" href="./images/index/index_icon.png">
    <link rel="stylesheet" crossorigin href="./assets/index-DBwFzK5i.css">
    <link rel="stylesheet" href="./assets/header.css?v=6.5.1">
    <link rel="stylesheet" href="./assets/item.css?v=6.5.1">
</head>

<body>
    <div class="app">
        <div class="shared-sticky-header">
            <header id="header-container"></header>
        </div>

        <main class="item-container">
            <!-- Item List (Grid) -->
            <section class="item-list-section">
                <div class="search-filter-container">
                    <select id="filter-tag" class="filter-select">
                        <option value="all">종류: 전체</option>
                        <option value="0">요리 음식</option>
                        <option value="1">훈련 서적</option>
                        <option value="2">부적</option>
                        <option value="3">귀중품</option>
                    </select>

                    <select id="sort-select" class="filter-select">
                        <option value="default">기본 정렬</option>
                        <option value="name-asc">이름 오름차순</option>
                        <option value="rarity-desc">레어도 오름차순</option>
                        <option value="rarity-asc">레어도 내림차순</option>
                    </select>

                    <div class="search-wrapper">
                        <input type="text" id="item-search" placeholder="아이템 검색..." autocomplete="off">
                    </div>
                </div>

                <div class="item-grid" id="item-grid">
                    <!-- Item Cards will be rendered here -->
                </div>
            </section>

            <!-- Item Detail Modal -->
            <div id="item-modal" class="item-modal hidden">
                <div class="modal-content">
                    <button class="close-button">&times;</button>
                    <!-- <button class="nav-btn prev-btn"></button>
                    <button class="nav-btn next-btn"></button> -->

                    <div class="item-detail-layout">
                        <!-- Left Column: Image -->
                        <div class="detail-left">
                            <div class="item-image-container">
                                <img id="item-image" src="" alt="Item Image" class="item-image">
                            </div>
                        </div>

                        <!-- Right Column: Info -->
                        <div class="detail-right">
                            <div class="item-header-info">
                                <h2 id="item-name">아이템 이름</h2>
                                <div class="tags">
                                    <span id="item-tag-badge" class="tag">태그</span>
                                    <span id="item-cost-badge" class="tag cost-tag" style="display:none">가격</span>
                                    <span id="item-refund-badge" class="tag refund-tag" style="display:none">잠재력</span>
                                    <span id="item-target-badge" class="tag target-tag" style="display:none">대상</span>
                                </div>
                            </div>

                            <div class="item-info-body">
                                <div class="info-section">
                                    <h3>설명</h3>
                                    <p id="item-desc" class="item-desc content-box">설명 내용...</p>
                                </div>

                                <div class="info-section" id="effect-section">
                                    <h3>효과</h3>
                                    <ul id="item-effects">
                                        <!-- Effects List -->
                                    </ul>
                                </div>

                                <div class="info-section" id="obt-section">
                                    <h3>획득 장소</h3>
                                    <p id="item-obt-place" class="content-box"></p>
                                </div>

                                <div class="info-section" id="usage-section">
                                    <h3>사용 이벤트</h3>
                                    <p id="item-journey-req" class="journey-link content-box"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer id="footer-container"></footer>
    </div>

    <script src="./assets/header_manager.js?v=6.5.1"></script>
    <script src="./assets/footer_manager.js"></script>
    <script src="./assets/hangul_utils.js?v=6.5.1"></script>
    <script src="./assets/item_manager.js?v=6.5.1"></script>
    <script>
        // Initialize State
        (function () {
            const html = document.documentElement;
            const savedTheme = localStorage.getItem('theme') || 'dark';
            html.setAttribute('data-theme', savedTheme);
        })();

        document.addEventListener('DOMContentLoaded', () => {
            if (window.HeaderManager) window.HeaderManager.init(document.getElementById('header-container'), 'item');
            if (window.FooterManager) window.FooterManager.init(document.getElementById('footer-container'));

            if (window.ItemManager) {
                window.ItemManager.init();
            } else {
                console.error('ItemManager not found!');
            }
        });
    </script>
</body>

</html>
